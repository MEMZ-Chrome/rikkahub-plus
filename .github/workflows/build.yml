name: Build APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Release 说明里会写「基于上游哪个版本构建」，合并上游后记得改这里
  UPSTREAM_BASE: RikkaHub v3.3.1+ (c08d7200)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 发 Release 时要列「本次新增」的提交，浅克隆里没有历史也没有 tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 与 Android Studio 自带的 JetBrains Runtime 21 保持一致
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          # jetbrains 安装器通过 GitHub API 查询版本，带上 token 避免被限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # :web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run search unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew :search:testDebugUnitTest :search:lintDebug --stacktrace

      - name: Build release APK
        env:
          # tag 构建时把 tag 名（去掉 v）当作 versionName，和 release 版本对上，应用内更新才能比出版本差
          TAG_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          chmod +x gradlew
          if [ -n "$TAG_VERSION" ]; then
            echo "versionName = ${TAG_VERSION#v}"
            ./gradlew assembleGithubRelease -PversionName="${TAG_VERSION#v}" --stacktrace
          else
            echo "versionName = (default)"
            ./gradlew assembleGithubRelease --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-plus
          path: app/build/outputs/apk/github/release/*.apk
          retention-days: 30

      # 上一个 tag 到这次 tag 之间的提交，当作 Release 的「新增内容」
      - name: Collect changes
        if: startsWith(github.ref, 'refs/tags/v')
        id: changes
        run: |
          prev=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          # ci / release 这类提交用户看不着，不写进「新增内容」
          filter='^- (ci|release)(\(|:)'
          if [ -n "$prev" ]; then
            commits=$(git log --no-merges --pretty='- %s' "$prev..${{ github.ref_name }}" | grep -viE "$filter" || true)
            echo "previous tag: $prev"
          else
            commits=$(git log --no-merges --pretty='- %s' "${{ github.ref_name }}" | grep -viE "$filter" || true)
            echo "previous tag: none"
          fi
          if [ -z "$commits" ]; then
            commits="- 细节调整与修复"
          fi
          {
            echo "notes<<NOTES_EOF"
            echo "$commits"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # 打 tag 时顺手发一个 Release，不用登录就能直接下 APK
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: RikkaHub Plus ${{ github.ref_name }}
          files: app/build/outputs/apk/github/release/*.apk
          body: |
            ## 新增内容

            ${{ steps.changes.outputs.notes }}

            ## 构建信息

            - 基于上游 ${{ env.UPSTREAM_BASE }}，加上本仓库的改动
            - 本版提交 `${{ github.sha }}`
            - 版本号 `${{ github.ref_name }}`

            ## 能否共存

            包名 `me.memzchrome.rikkahubplus`，和官方版不同，**可以和官方版同时安装**；
            同包名可以直接覆盖升级本项目的旧版本。

            ## 安装包

            - `app-github-universal-release.apk`：通用包，不确定机型就装这个
            - `app-github-arm64-v8a-release.apk` / `app-github-x86_64-release.apk`：按架构拆分，体积小一些
